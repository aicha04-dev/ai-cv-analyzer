nelmio_cors:
    defaults:
        origin_regex: false
        allow_origin:
            - 'http://127.0.0.1:5173'
            - 'http://localhost:5173'
            - 'https://ai-cv-analyzer-n131fx5l7-ai-cv-matcher.vercel.app'
        allow_methods:
            - GET
            - OPTIONS
            - POST
            - PUT
            - PATCH
            - DELETE
        allow_headers:
            - Content-Type
            - Authorization
            - Accept
        expose_headers:
            - Link
        max_age: 3600
        allow_credentials: true

    paths:
        '^/api/':
            allow_origin:
                - 'http://127.0.0.1:5173'
                - 'http://localhost:5173'
                - 'https://ai-cv-analyzer-n131fx5l7-ai-cv-matcher.vercel.app'
            allow_methods:
                - GET
                - OPTIONS
                - POST
                - PUT
                - PATCH
                - DELETE
            allow_headers:
                - Content-Type
                - Authorization
                - Accept
            expose_headers:
                - Link
            max_age: 3600
            allow_credentials: true